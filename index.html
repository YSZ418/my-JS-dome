<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的记事本</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            background-color: rgb(244, 243, 243);
            height: 100vh;
        }
        .sidebor{
            width: 270px;
            border-right:1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            background-color: rgb(255, 255, 255);
        }
        .sidebor-top{
            height: 80px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
        }
        .sidebor-top-title{
            font-size: 22px;
        }
        .create-bnt{
            padding: 6px 14px;
            font-size: 16px;
            border: none;
            background-color: rgb(93, 235, 93);
            color: #fcfcfc;
            border-radius: 6px;
            cursor: pointer;
        }
        .editor-empty{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        p{
            text-align: center;
            font-size: 20px;
            color: dimgray;
        }
        .editor{
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .editor-top{
            height: 100px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
        }
        .top-title{
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 5px 20px;
            flex: 1;
        }
        .title-input{
            border: none;
            height: 50%;
            outline: none;
            border-radius: 6px;
            font-size: 20px;
        }
        .top-bnt{
            width: 30%;
            display: flex;
            justify-content: start;
            align-items: center;
        }
        .delete-bnt{
            padding: 7px 15px;
            font-size: 16px;
            border: 1px solid #f29292;
            color: #f29292;
            border-radius: 6px;
            cursor: pointer;
           
        }
        .save-bnt{
            padding: 7px 15px;
            font-size: 16px;
            border: 1px solid #7cccf4;
            color: #7cccf4;
            border-radius: 6px;
            margin-left: 15px;
            cursor: pointer;
        }
        textarea{
            flex: 1;
            border: none;
            padding: 16px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            line-height: 1.6;
            resize: none;
        }
        .item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .item:hover {
      background: #f5f5f5;
    }

    .item-act {
      background: #e8f5e9;
      border-left: 3px solid #0FDC78;
    }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .item-content {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .find{
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #e0e0e0;
        height: 40px;
    }
    .find-input{
        flex: 1;
        border: none;
        outline: none;
        font-size: 15px;
        padding: 3px 7px;
    }
    .OK{
        width: 60px;
        border: none;
        border-left: 1px solid #e0e0e0;
        color:#999 ;
        background-color: rgb(255, 255, 255);
        cursor: pointer;
        font-size: 15px;
    }

    </style>
</head>
<body>
    <div class="sidebor">
        <div class="sidebor-top">
            <span class="sidebor-top-title">我的记事本</span>
            <button class="create-bnt">+新建</button>
        </div>
        <div class="find">
            <input class="find-input" type="text" placeholder="请输入要搜索的标题">
            <button class="OK">确定</button>
        </div>
        <div class="list">

        </div>
    </div>
    <div class="editor-empty" style="display: flex;" >
        <p>请点击右侧+新建，创建你的记事本吧</p>
    </div>
    <div class="editor" style="display: none;">
        <div class="editor-top">
            <div class="top-title">
                <input class="title-input" type="text" placeholder="请输入你的标题......">
            </div>
            <div class="top-bnt">
                <button class="delete-bnt">删除</button>
                <button class="save-bnt">保存</button>
            </div>
        </div>
        <textarea class="textarea" placeholder="也许你可以记录些什么......"></textarea>
    </div>
    <script>
        let notes = JSON.parse(localStorage.getItem('notes')||'[]');
        let nowId = null;
        let searchKey = '';
        function renderNoteList(){
            const list = document.getElementsByClassName('list')[0];
            list.innerHTML = '';
            const showNotes = searchKey ? notes.filter(n => n.title.includes(searchKey)) : notes;
            showNotes.forEach(note => {
                const itme = document.createElement('div');
                itme.className = 'item' + (nowId === note.id ? ' item-act' : '');

                itme.innerHTML = `
                    <div class="item-title">${note.title||'新建文件'}</div>
                `;
                itme.onclick = () => slNote(note.id);
                list.appendChild(itme);
            });
        }
        function renderNoteEditor(){
            const editorempty = document.getElementsByClassName('editor-empty')[0];
            const editor = document.getElementsByClassName('editor')[0];
            const titleinput = document.getElementsByClassName('title-input')[0];
            const textarea = document.getElementsByClassName('textarea')[0];
            if(nowId===null){
                editorempty.style.display = 'flex';
                editor.style.display = 'none';
            } else {
                editorempty.style.display = 'none';
                editor.style.display = 'flex';
                const now = notes.find(now => now.id === nowId);
                titleinput.value = now.title;
                textarea.value = now.content;
            }

        }
        function createNote(){
            const note = {
                id: Date.now(),
                title: '',
                content: '',
                createTime: Date.now()
            };
            nowId = note.id;
            notes.unshift(note);
            saveNotes();
            renderNoteEditor();
            renderNoteList();
        }
        function saveNotes(){
            localStorage.setItem('notes',JSON.stringify(notes));
        }
        function slNote(id){
            nowId = id;
            renderNoteEditor();
            renderNoteList();
        }
        function deleNote(){
            if(nowId===null)return;
            notes = notes.filter(n => n.id !==nowId);
            nowId = null;
            saveNotes();
            renderNoteList();
            renderNoteEditor();
        }
        function saveBntNote(){
            if(nowId===null)return;
            const note = notes.find(n => n.id ===nowId);
            note.title = document.getElementsByClassName('title-input')[0].value;
            note.content = document.getElementsByClassName('textarea')[0].value;
            saveNotes();
            renderNoteList();
            renderNoteEditor();
        }
        function findNote(){
            const t = document.getElementsByClassName('find-input')[0];
            const titleOfFind = t.value;
            const found = notes.find(n => n.title.includes(titleOfFind));
            if(!found){
                return;
            }

            slNote(found.id);
        }
        document.getElementsByClassName('create-bnt')[0].onclick = createNote;
        document.getElementsByClassName('delete-bnt')[0].onclick = deleNote;
        document.getElementsByClassName('save-bnt')[0].onclick = saveBntNote;
        document.getElementsByClassName('OK')[0].onclick = findNote;
        document.getElementsByClassName('find-input')[0].oninput = function(){
            searchKey = this.value;
            renderNoteList();
        }
        renderNoteList();
        renderNoteEditor();
    </script>
</body>
</html>
